name: topic-tutorial
version: "3.0"
description: >
  Agent-driven tutorial pipeline (v3, spec docs/topic-tutorial-v3-handoff.md). Takes a code repo,
  website URL(s), PDF(s) or a topic and produces a 16:9 tutorial presented by a beautified
  digital twin of the owner (built once by presenter-onboarding; if the twin fails, the video has
  no presenter), with real sandbox-captured footage, diagrams and rights-cleared media. Runs
  natively on Apple Silicon at $0 by default; every paid call is itemized at proposal.
  Gates: proposal, scene_plan, assets, compose. Stage models: config/topic-tutorial/model_routing.yaml.
category: hybrid
stability: production
default_checkpoint_policy: guided

reference_input:
  supported: true
  analysis_depth: standard
  analysis_tools:
    - video_analyzer
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

orchestration:
  mode: executive-producer
  skill: pipelines/topic-tutorial/executive-producer
  budget_default_usd: 0.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 20

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: true

required_skills:
  - pipelines/topic-tutorial/executive-producer
  - pipelines/topic-tutorial/research-director
  - pipelines/topic-tutorial/proposal-director
  - pipelines/topic-tutorial/script-director
  - pipelines/topic-tutorial/scene-director
  - pipelines/topic-tutorial/asset-director
  - pipelines/topic-tutorial/presenter-director
  - pipelines/topic-tutorial/edit-director
  - pipelines/topic-tutorial/compose-director
  - pipelines/topic-tutorial/publish-director
  - pipelines/topic-tutorial/review-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  recommended:
    - clean-professional
    - software-technical
    - ai-news-explainer
  also_works:
    - flat-motion-graphics
    - minimalist-diagram
    - science-math
    - history-timeline
    - finance-data
  custom_allowed: true

stages:
  - name: research
    skill: pipelines/topic-tutorial/research-director
    optional_artifacts_in:
      - source_media_review
      - video_analysis_brief
    produces:
      - research_brief
    tools_available:
      - universal_ingestor
      - video_analyzer
      - transcript_fetcher
      - video_downloader
      - scene_detect
      - frame_sampler
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Material intake is properly parsed and indexed
      - Secrets and credentials are completely redacted
      - Core facts and citations are verified
    success_criteria:
      - Schema-valid research_brief with at least 3 data points
      - At least 3 angles discovered
      - Every claim has a source_ref (URL, file+line, or PDF page); key claims have 2+ independent sources
      - Media sourcing candidates carry rights_status, license, source_url, attribution

  - name: proposal
    skill: pipelines/topic-tutorial/proposal-director
    required_artifacts_in:
      - research_brief
    produces:
      - proposal_packet
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Concepts reflect source material accurately
      - Every paid call is itemized in cost_estimate.paid_calls (default total $0.00)
      - Presenter plan, capture plan, music plan and playbook verified flag are shown
      - Composition runtime and composition mode choices are explicitly logged
    success_criteria:
      - Schema-valid proposal_packet with at least 2 distinct concepts
      - Itemized paid_calls table with total_est_usd (approval covers estimate + 20%)
      - decision_log with render_runtime_selection entry

  - name: script
    skill: pipelines/topic-tutorial/script-director
    required_artifacts_in:
      - proposal_packet
    produces:
      - script
    tools_available: []
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Narrative flow is logical and engaging
      - Speech pacing is appropriate for technical clarity (140-160 WPM)
      - Factual assertions link to source material
    success_criteria:
      - Schema-valid script artifact
      - All scenes have narration text and estimated duration

  - name: scene_plan
    skill: pipelines/topic-tutorial/scene-director
    required_artifacts_in:
      - script
    produces:
      - scene_plan
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Scene layout matches content type (code, diagram, stat card, text card)
      - Presenter scenes have graceful degradation plan
      - Visual hierarchy and readability
    success_criteria:
      - Schema-valid scene_plan artifact
      - Every script scene has corresponding visual props and layout specification

  - name: assets
    skill: pipelines/topic-tutorial/asset-director
    required_artifacts_in:
      - scene_plan
    produces:
      - asset_manifest
    tools_available:
      - tts_selector
      - mlx_tts
      - piper_tts
      - google_flow_import
      - gemini_omni_video
      - diagram_gen
      - screenshot_import
      - screen_recording_import
      - alignment_provider
      - code_snippet
      - direct_clip_search
      - sandbox_capture
      - threejs_world
    checkpoint_required: false
    human_approval_default: true
    review_focus:
      - Narration audio generated with clean speech and dynamic sample rate
      - Word timings come from forced alignment; alignment_method is stated (heuristic fallback flagged)
      - Presenter assets are beautified-twin assets from the presenter profile, or presenter_status is skipped_failed with a reason (never a fixture)
      - Visual assets (diagrams, screen captures, broll) satisfied for every visual beat
    success_criteria:
      - Schema-valid asset_manifest artifact containing audio and visual assets
      - All media files exist, are confined to project, and verified by ffprobe

  - name: edit
    skill: pipelines/topic-tutorial/edit-director
    required_artifacts_in:
      - asset_manifest
      - scene_plan
    produces:
      - edit_decisions
    tools_available: []
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Exact frame counts computed at 30 fps
      - Caption timestamps match word timings
      - Visual cut transitions and durations
    success_criteria:
      - Schema-valid edit_decisions artifact
      - Frame durations sum to total video duration

  - name: compose
    skill: pipelines/topic-tutorial/compose-director
    required_artifacts_in:
      - edit_decisions
    produces:
      - render_report
    tools_available:
      - video_compose
      - hyperframes_compose
      - remotion_caption_burn
      - video_stitch
      - audio_mixer
      - audio_enhance
      - visual_qa
      - composition_validator
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Render succeeds at target resolution and frame rate
      - Video and audio streams are synchronized
      - No frozen or black frames
    success_criteria:
      - Schema-valid render_report artifact
      - Final MP4 exists in renders/ directory and passes ffprobe

  - name: publish
    skill: pipelines/topic-tutorial/publish-director
    required_artifacts_in:
      - render_report
    produces:
      - publish_log
    tools_available:
      - export_bundle
      - subtitle_gen
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Deliverables bundled and ready
    success_criteria:
      - Schema-valid publish_log artifact
