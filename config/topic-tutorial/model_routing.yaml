# Per-stage model tiers for the topic-tutorial pipeline (spec D12, §5.1).
# Editable: change a stage's tier here; no manifest edit needed.
# The main session reads this file and delegates each stage to a sub-agent on the tier's model.
# `gemini_cli` names are placeholders — verify against the installed Gemini CLI before relying on them.
tiers:
  deep:     { claude_code: opus,   model_id: claude-opus-5-5,   gemini_cli: gemini-3.8-pro }
  standard: { claude_code: sonnet, model_id: claude-sonnet-5-5, gemini_cli: gemini-3.8-flash }
  fast:     { claude_code: haiku,  model_id: claude-haiku-5-5,  gemini_cli: gemini-3.8-flash-lite }
stages:
  research.plan_and_synthesize: deep
  research.search_workers:      standard
  proposal:                     deep
  script:                       deep
  scene_plan:                   deep
  critic.script:                deep
  critic.scene_plan:            deep
  assets:                       standard   # includes driving sandbox captures
  edit:                         standard
  compose:                      standard
  qa.frame_review:              fast
  publish:                      fast
onboarding:
  identity_build: standard
  voice_lab:      standard
