# Playbook verification state for topic-tutorial (sidecar; lives here, not in styles/, because the playbook loader globs styles/topic-tutorial/*.yaml) (decision D20, spec §5.10).
# A playbook is `verified: true` only after the owner approved a real end-to-end run in it at the
# compose gate. Others stay selectable but are labelled unverified in the proposal.
software-technical:
  verified: false          # flip to true after the owner approves the no-presenter validation run (fix round, Group E)
  verified_by_run: null
  verified_on: null
ai-news-explainer:
  verified: false
finance-data:
  verified: false
history-timeline:
  verified: false
science-math:
  verified: false
